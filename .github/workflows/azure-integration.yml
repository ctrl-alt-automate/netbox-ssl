name: Azure Integration

# The federated credential is scoped to refs/heads/main, so this cannot run on a
# pull request — fork PRs have no path to Azure by design. During development the
# same checks run locally via `az login`; here they guard against drift.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "netbox_ssl/adapters/azure_kv.py"
      - "tests/test_azure_kv_live.py"
      - ".github/workflows/azure-integration.yml"

permissions:
  id-token: write   # required for OIDC
  contents: read

jobs:
  integration-azure:
    name: Azure Key Vault (live)
    runs-on: ubuntu-latest
    # Main only (the federated credential is scoped to it), and only while the
    # test resources exist. They are temporary: once the vault and the three
    # repository variables are removed, `azure/login` has nothing to log in
    # with, and this job must show as skipped rather than fail for a reason
    # unrelated to the code. Setting the variables again re-enables it.
    if: github.ref == 'refs/heads/main' && vars.AZURE_CLIENT_ID != ''
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e '.[azure,dev]'

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Live adapter tests
        env:
          # This job authenticates as the CI service principal, which holds only
          # `Key Vault Reader` on rg-netbox-ssl-test (verified: one role
          # assignment, nothing wider). That is what makes the privilege canary
          # meaningful here and skippable anywhere else.
          AZURE_KV_LEAST_PRIVILEGE_IDENTITY: "1"
        run: python -m pytest tests/test_azure_kv_live.py -v -p no:django -m azure_live
